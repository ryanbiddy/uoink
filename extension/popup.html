<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uoink</title>
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    * { box-sizing: border-box; }
    html { width: 360px; max-width: 100%; background: var(--bg); color: var(--text); }
    body { margin: 0; width: 360px; max-width: 100%; height: 600px; max-height: 600px; display: flex; flex-direction: column; font: 13px/1.5 var(--font-ui); background: var(--bg); color: var(--text); }
    .hidden, [hidden] { display: none !important; }
    h1, h2, h3, p { margin: 0; }
    h1 { font: 22px/1 var(--font-display); }
    h2 { font-size: 13px; font-weight: 700; }
    h3 { font-size: 13px; font-weight: 600; }
    .popup-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .helper-state { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
    .status-dot.running { background: var(--ok); }
    .status-dot.offline { background: var(--action); }
    main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; }
    section { padding: 16px; }
    .this-tab { border-bottom: 1px solid var(--line); }
    .tab-preview { display: flex; gap: 12px; margin: 12px 0; align-items: center; }
    .thumbnail { width: 72px; height: 48px; flex: 0 0 72px; border-radius: var(--radius-thumb); overflow: hidden; background: var(--surface-sel); }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
    .tab-copy { min-width: 0; }
    .tab-title, .capture-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .tab-source, .capture-source, .capture-state, .empty-state, .hint { color: var(--text-2); font-size: 12px; }
    button, input, select, a { font: inherit; }
    /* Button system shared with the dashboard and setup page (UI review
       2026-10-31): secondary by default, .primary, .ghost, .danger; 600
       weight, pill; compact 32px here except the 44px main actions. */
    button, .button { min-height: 32px; border: 1px solid var(--btn-border); border-radius: var(--radius-pill); background: var(--surface); color: var(--text); padding: 0 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; }
    button:hover, .button:hover { background: var(--btn-hover); color: var(--text); }
    button:active, .button:active { background: var(--btn-press); color: var(--text); }
    button.ghost { border-color: transparent; background: transparent; }
    button.primary { min-height: 44px; padding: 0 14px; font-size: 14px; background: var(--action); border-color: var(--action); color: var(--on-action); }
    button.primary:hover { background: var(--btn-primary-hover); border-color: var(--btn-primary-hover); color: var(--on-action); }
    button.primary:active { background: var(--btn-primary-press); border-color: var(--btn-primary-press); color: var(--on-action); }
    button.danger { background: var(--btn-danger); border-color: var(--btn-danger); color: var(--on-danger); }
    button.danger:hover { background: var(--btn-danger-hover); border-color: var(--btn-danger-hover); color: var(--on-danger); }
    button.danger:active { background: var(--btn-danger-press); border-color: var(--btn-danger-press); color: var(--on-danger); }
    button:disabled, button:disabled:hover, button:disabled:active { cursor: not-allowed; color: var(--on-btn-disabled); background: var(--btn-disabled); border-color: transparent; }
    button[aria-busy="true"] { cursor: progress; pointer-events: none; }
    button.primary[aria-busy="true"]:disabled { background: var(--action); border-color: var(--action); color: var(--on-action); }
    button[aria-busy="true"]::before { content: ""; width: 14px; height: 14px; flex: 0 0 auto; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: button-spin .8s linear infinite; }
    @keyframes button-spin { to { transform: rotate(360deg); } }
    #uoink-current-btn { width: 100%; }
    #uoink-podcast-btn, #uoink-allow-retry-btn { margin-top: 8px; min-height: 44px; }
    .hint:not(:empty), .source-alert:not(.hidden) { margin-top: 8px; }
    .source-alert { color: var(--rust-bright); overflow-wrap: anywhere; }
    .source-alert button { float: right; margin-left: 8px; }
    .paste-form { margin-top: 12px; }
    .paste-form label { display: block; margin-bottom: 4px; color: var(--text-2); font-size: 12px; }
    .paste-controls { display: flex; gap: 8px; }
    input[type="url"], input[type="text"] { min-width: 0; width: 100%; min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius-input); padding: 8px 12px; color: var(--text); background: var(--surface); }
    input::placeholder { color: var(--text-2); opacity: 1; }
    .paste-controls button { min-height: 44px; }
    .captures-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .captures-heading span { color: var(--text-2); font-size: 12px; }
    .captures-list { list-style: none; padding: 0; margin: 0; }
    .capture-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .capture-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .capture-source { overflow-wrap: anywhere; }
    .capture-state { margin-top: 4px; }
    .capture-state.failed, .capture-error { color: var(--rust-bright); }
    .capture-error { font: 11px/1.5 var(--font-mono); overflow-wrap: anywhere; margin-top: 4px; }
    .capture-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .step-strip { display: flex; gap: 4px; margin-top: 8px; }
    .step { height: 3px; flex: 1; background: var(--step-todo); }
    .step.done { background: var(--step-done); }
    .step.now { background: var(--step-now); }
    .step.fail { background: var(--step-fail); }
    .step.advanced { animation: step-advance var(--dur-enter) var(--ease-enter); transform-origin: left; }
    @keyframes step-advance { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .empty-state { padding: 12px 0; }
    .popup-footer { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--line); }
    .popup-footer a { color: var(--text); min-height: 44px; display: inline-flex; align-items: center; padding: 4px 8px; text-underline-offset: 3px; }
    .popup-footer a:hover { background: var(--surface-sel); border-radius: var(--radius-thumb); }
    #popup-version { margin-left: auto; color: var(--text-2); font-size: 11px; }
    .picker { margin-top: 12px; }
    .picker summary { min-height: 32px; cursor: pointer; }
    .picker-choice { display: flex; align-items: center; gap: 8px; padding: 4px 0; min-height: 44px; }
    .picker-choice img { width: 64px; height: 40px; object-fit: cover; border-radius: var(--radius-thumb); background: var(--surface-sel); }
    .picker-choice input { accent-color: var(--action); }
    .capture-tools { margin-top: 8px; }
    .capture-tools summary { min-height: 32px; cursor: pointer; }
    .hook-form { margin-top: 12px; }
    .hook-form select { width: 100%; min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius-input); padding: 8px; background: var(--surface); color: var(--text); }
    .hook-form select:disabled { background: var(--surface-sel); color: var(--text-2); }
    .hook-form option { background: var(--surface); color: var(--text); }
    .hook-correction-message { color: var(--text-2); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .hook-correction-message.error { color: var(--rust-bright); }
    .prompt-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .prompt-row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) { .step.advanced { animation: none; } }
  </style>
</head>
<body>
  <header class="popup-header">
    <h1>Uoink</h1>
    <div class="helper-state" role="status"><span id="dot" class="status-dot" aria-hidden="true"></span><span id="status">Checking</span></div>
  </header>
  <main aria-label="Capture a source">
    <section class="this-tab" aria-labelledby="this-tab-heading">
      <h2 id="this-tab-heading">This tab</h2>
      <p id="status-help" class="hint" role="status"></p>
      <div class="tab-preview">
        <div class="thumbnail" aria-hidden="true"><img id="current-source-thumbnail" width="72" height="48" alt="" hidden></div>
        <div class="tab-copy"><h3 id="current-source-preview" class="tab-title">Checking current tab...</h3><p id="current-source-origin" class="tab-source"></p></div>
      </div>
      <button id="uoink-current-btn" class="primary" type="button" disabled>Uoink this page</button>
      <button id="uoink-podcast-btn" class="hidden" type="button">Add this podcast feed</button>
      <button id="uoink-allow-retry-btn" class="hidden" type="button">Allow this site and retry</button>
      <p id="current-source-note" class="hint hidden"></p>
      <div id="current-source-alert" class="source-alert hidden" role="alert"><button id="current-source-alert-dismiss" type="button" aria-label="Dismiss error">Dismiss</button><span id="current-source-alert-text"></span></div>
      <form id="paste-form" class="paste-form" novalidate>
        <label for="paste-url">or paste a link</label>
        <div class="paste-controls"><input id="paste-url" type="url" inputmode="url" placeholder="https://..." autocomplete="off" spellcheck="false" aria-describedby="paste-error"><button id="paste-add" type="submit">Add</button></div>
        <p id="paste-error" class="source-alert" role="alert"></p>
      </form>
      <p id="popup-toast" class="hint" role="status" aria-live="polite"></p>
    </section>
    <section class="captures" aria-labelledby="captures-heading">
      <div class="captures-heading"><h2 id="captures-heading">Captures</h2><span id="capture-count"></span></div>
      <p id="capture-sync" class="hint" role="status"></p>
      <ul id="captures-list" class="captures-list"><li class="empty-state">No captures yet.</li></ul>
      <div id="pending-picker"></div>
      <details id="starter-prompts" class="picker">
        <summary>Starter prompts</summary>
        <p class="hint">Copy a prompt after pasting your capture into Claude or ChatGPT.</p>
        <p id="starter-prompts-status" class="hint" role="status" aria-live="polite"></p>
        <div id="starter-prompts-list"></div>
      </details>
      <details id="research-session" class="picker">
        <summary>Research session</summary>
        <p class="hint">Collect videos with the browser's “Add to research session” menu.</p>
        <p id="session-status" class="hint" role="status"></p>
        <form id="session-start-form" class="paste-form">
          <label for="session-name">Session name (optional)</label>
          <input id="session-name" type="text" maxlength="80" autocomplete="off">
          <div class="capture-actions"><button id="start-session" type="submit">Start session</button></div>
        </form>
        <div id="session-active" hidden>
          <p id="session-active-name"></p>
          <div class="capture-actions"><button id="end-session" type="button">End session and copy</button><button id="cancel-session" type="button">Cancel session</button></div>
        </div>
        <div id="recent-sessions" class="capture-actions"></div>
      </details>
    </section>
  </main>
  <footer class="popup-footer" aria-label="Dashboard">
    <a id="open-library" href="http://127.0.0.1:5179/dashboard#library" target="_blank" rel="noreferrer">Library</a>
    <a id="open-settings" href="http://127.0.0.1:5179/dashboard#settings/capture" target="_blank" rel="noreferrer">Settings</a>
    <span id="popup-version"></span>
  </footer>
  <script src="lib/x-article.js"></script>
  <script src="lib/extract.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/popup-captures.js"></script>
  <script src="popup.js"></script>
</body>
</html>
