name: macOS qualification

on:
  workflow_dispatch:
  push:
    branches:
      - 'mac/**'

permissions:
  contents: read

concurrency:
  group: mac-qualify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Keep qualification separate from every required job in ci.yml.
# macos-15 is the explicit Apple Silicon image; each job also asserts arm64.
# Runtime testing on 15 does not establish the provisional macOS 14 floor.
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  portable-tests:
    name: portable tests (Python ${{ matrix.python }})
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Establish disposable profile before imports
        run: bash scripts/mac/runner-env.sh
      - name: Record runner and Python
        run: bash scripts/mac/runner-info.sh "$RUNNER_TEMP/mac-evidence/environment.txt"
      - name: Install the existing stdlib suite dependencies
        run: python -m pip install pytest Pillow "mcp<2"
      - name: Run the unchanged portable suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -q -rfE --junitxml="$RUNNER_TEMP/mac-evidence/pytest.xml"
      - name: Record installed versions
        if: always()
        run: python -m pip freeze --all | tee "$RUNNER_TEMP/mac-evidence/pip-freeze.txt"
      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-portable-py${{ matrix.python }}
          path: ${{ runner.temp }}/mac-evidence/
          if-no-files-found: error
          retention-days: 14

  dependency-graph:
    name: dependency graph
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Establish disposable profile before imports
        run: bash scripts/mac/runner-env.sh
      - name: Record runner and Python
        run: bash scripts/mac/runner-info.sh "$RUNNER_TEMP/mac-evidence/environment.txt"
      - name: Probe every pin and attempt the combined graph
        id: wheels
        continue-on-error: true
        run: python scripts/mac/qualify_deps.py wheels --output "$RUNNER_TEMP/mac-evidence/deps"
      - name: Download and hash standalone Python candidates
        id: standalone
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python scripts/mac/qualify_deps.py standalone --output "$RUNNER_TEMP/mac-evidence/standalone"
      - name: Record installed versions
        if: always()
        run: python -m pip freeze --all | tee "$RUNNER_TEMP/mac-evidence/pip-freeze.txt"
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-dependency-evidence
          path: |
            ${{ runner.temp }}/mac-evidence/environment.txt
            ${{ runner.temp }}/mac-evidence/pip-freeze.txt
            ${{ runner.temp }}/mac-evidence/deps/*.json
            ${{ runner.temp }}/mac-evidence/deps/*.txt
            ${{ runner.temp }}/mac-evidence/deps/logs/
            ${{ runner.temp }}/mac-evidence/standalone/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload found wheels for import smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-qualified-wheels
          path: ${{ runner.temp }}/mac-evidence/deps/wheels/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Surface incomplete dependency qualification
        if: ${{ !cancelled() && (steps.wheels.outcome != 'success' || steps.standalone.outcome != 'success') }}
        run: exit 1

  import-smoke:
    name: import smoke
    needs: dependency-graph
    if: ${{ always() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Establish disposable profile before imports
        run: bash scripts/mac/runner-env.sh
      - name: Record runner and Python
        run: bash scripts/mac/runner-info.sh "$RUNNER_TEMP/mac-evidence/environment.txt"
      - name: Fetch the wheels Job B actually found
        uses: actions/download-artifact@v4
        with:
          name: mac-qualified-wheels
          path: ${{ runner.temp }}/mac-wheels
      - name: Create a fresh venv
        run: python -m venv "$RUNNER_TEMP/mac-smoke-venv"
      - name: Install found wheels and exercise imports and stdio
        run: >-
          python scripts/mac/import_smoke.py
          --python "$RUNNER_TEMP/mac-smoke-venv/bin/python"
          --wheels "$RUNNER_TEMP/mac-wheels"
          --output "$RUNNER_TEMP/mac-evidence/smoke"
      - name: Record installed versions
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/mac-smoke-venv/bin/python" ]; then
            "$RUNNER_TEMP/mac-smoke-venv/bin/python" -m pip freeze --all | tee "$RUNNER_TEMP/mac-evidence/pip-freeze.txt"
          else
            python -m pip freeze --all | tee "$RUNNER_TEMP/mac-evidence/pip-freeze.txt"
          fi
      - name: Upload import and protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-import-smoke
          path: ${{ runner.temp }}/mac-evidence/
          if-no-files-found: error
          retention-days: 14
