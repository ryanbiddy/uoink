name: CI

on:
  push:
    branches:
      - v2-integration
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - v2-integration
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extension-static:
    name: extension static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Parse extension JavaScript
        run: |
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint extension JavaScript for undefined globals
        run: |
          # v2.1 rename: the extension UI global is renamed YoinkUI -> UoinkUI
          # by the extension agent's PR. Declare BOTH so this guard stays green
          # whether or not that rename has merged yet (a not-yet-defined global
          # is harmless to eslint; an undefined-USE is what no-undef catches).
          npx --yes eslint@8 --no-eslintrc \
            --env browser,worker,webextensions,es2022 \
            --rule 'no-undef: error' \
            --rule 'no-unused-vars: off' \
            --global STC --global YoinkUI --global UoinkUI --global XArticle --global PopupCaptures \
            $(find extension -name '*.js' -print)

      - name: Validate JSON files
        run: |
          python -m json.tool extension/manifest.json >/dev/null
          python -m json.tool extension/prompts.json >/dev/null
          python -m json.tool topics.json >/dev/null

      - name: Check manifest version against VERSION
        run: |
          count="$(grep -c '"version"' extension/manifest.json)"
          if [ "$count" -ne 1 ]; then
            echo "extension/manifest.json must contain exactly one version field; found $count"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit(f"manifest version {manifest.get('version')!r} != VERSION {version!r}")
          PY

      - name: Guard against noisy extension logs
        run: |
          # Catches the legacy [Yoink] prefix and the renamed [Uoink] one so
          # the no-noisy-logs guard stays meaningful across the rename.
          if grep -nE 'console\.log\([[:space:]]*"\[(Yoink|Uoink)\]' extension/lib/extract.js; then
            echo 'Unexpected console.log("[Yoink|Uoink]"...) in extension/lib/extract.js'
            exit 1
          fi

  backend-static:
    name: backend Python static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile backend Python files
        run: |
          # v2.1 rename: canonical MCP modules are uoink_mcp*.py; yoink_mcp.py
          # is a back-compat shim that re-exports from uoink_mcp.
          files=(server.py uoink_usage.py uoink_mcp.py uoink_mcp_tools.py uoink_agent_runtime.py uoink_cli.py uoink_connect.py yoink_mcp.py)
          if [ -f index.py ]; then files+=(index.py); fi
          python -m py_compile "${files[@]}"

      - name: Check complete MCP inventory
        run: python scripts/check_mcp_inventory.py

      - name: Check generated agent kit skills
        run: python scripts/build_agent_kit.py --check

  doc-accuracy:
    name: doc accuracy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Removed in v2.1: the "guard security doc version drift" step (which
      # failed the build if "v2.1" appeared in docs/security.md) is dropped
      # per the approved decision -- security.md is now the v2.1 launch-facing
      # security model and legitimately references v2.1. See the §9 commit.

      - name: Compare VERSION and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit(f"manifest version {manifest.get('version')!r} != VERSION {version!r}")
          PY

      - name: Compare MCP inventory across registry, docs, bundle and receipt
        run: python scripts/check_mcp_inventory.py

  bash-lint:
    name: bash script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint launch readiness script
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/verify-launch-readiness.sh
          else
            bash -n scripts/verify-launch-readiness.sh
          fi

  stdlib-tests:
    name: stdlib tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        # mcp: the stdio entry point's SDK, required so the C-01 regression
        # test actually drives uoink_mcp.py instead of skipping. Pinned <2:
        # mcp 2.0.0 (2026-08) removed the mcp.server.fastmcp import path
        # uoink_mcp.py is written against; migrating to the 2.x API is a
        # separate ticket.
        # PyYAML (the installer lock's pin) so the Continue detection tests run instead of skipping.
        run: pip install pytest Pillow "mcp<2" "PyYAML==6.0.3"
      - name: Run tests
        # The Living Library tests import top-level modules (index, server,
        # library_*) directly, so the checkout root must be on PYTHONPATH.
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest tests/
