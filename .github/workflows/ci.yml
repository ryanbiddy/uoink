name: CI

on:
  push:
    branches:
      - v2-integration
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - v2-integration
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-install:
    name: installed headless Linux runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Uoink
        run: sh scripts/linux/install.sh --prefix "$RUNNER_TEMP/uoink-app" --bin-dir "$RUNNER_TEMP/bin" --no-model
      - name: Upgrade in place
        run: |
          mkdir -p "$RUNNER_TEMP/uoink-app/models"
          touch "$RUNNER_TEMP/uoink-app/models/upgrade-sentinel"
          touch "$RUNNER_TEMP/uoink-app/python/upgrade-sentinel"
          sh scripts/linux/install.sh --prefix "$RUNNER_TEMP/uoink-app" --bin-dir "$RUNNER_TEMP/bin" --no-model
          test -f "$RUNNER_TEMP/uoink-app/models/upgrade-sentinel"
          test -f "$RUNNER_TEMP/uoink-app/python/upgrade-sentinel"
      - name: Check installed CLI and MCP stdio
        env:
          HOME: ${{ runner.temp }}/home
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
          UOINK_HEADLESS: "1"
        run: |
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bin/uoink" status | python -c 'import json, os, sys; p = json.load(sys.stdin); assert p["ok"] is True; assert p["capabilities"]["media"]["available"] is True; assert p["data_dir"] == os.environ["XDG_DATA_HOME"] + "/Uoink"'
          "$RUNNER_TEMP/bin/uoink" tools > "$RUNNER_TEMP/tools.json"
          python "$GITHUB_WORKSPACE/scripts/linux/smoke_stdio.py" "$RUNNER_TEMP/bin/uoink"
          "$RUNNER_TEMP/bin/uoink" connect cursor > "$RUNNER_TEMP/connection.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          entry = json.loads((root / "connection.json").read_text())["mcpServers"]["uoink"]
          assert entry["command"] == str(root / "uoink-app/python/bin/python3")
          subprocess.run([entry["command"], "-c", "import mcp, faster_whisper"], check=True)
          PY
      - name: Check helper state and missing-ffmpeg status
        env:
          HOME: ${{ runner.temp }}/home
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
          UOINK_HEADLESS: "1"
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json, os, subprocess, time, urllib.request
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          app, profile = root / "uoink-app", root / "helper-profile"
          profile.mkdir()

          def inventory():
              return {str(p.relative_to(app)): (p.stat().st_size, p.stat().st_mtime_ns)
                      for p in app.rglob("*") if p.is_file() and "__pycache__" not in p.parts}

          before = inventory()
          with (root / "helper.log").open("w") as log:
              child = subprocess.Popen([str(root / "bin/uoink"), "serve",
                                        "--isolated-profile", str(profile),
                                        "--isolated-port", "18191", "--show-dashboard"],
                                       stdout=log, stderr=subprocess.STDOUT)
              try:
                  deadline = time.monotonic() + 60
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
                  while time.monotonic() < deadline:
                      assert child.poll() is None, (root / "helper.log").read_text()
                      try:
                          with opener.open("http://127.0.0.1:18191/health", timeout=1) as reply:
                              if json.load(reply).get("ok") is True:
                                  break
                      except (OSError, ValueError):
                          pass
                      time.sleep(0.2)
                  else:
                      raise AssertionError((root / "helper.log").read_text())
                  for name in ("token.txt", "server.pid", "server.log"):
                      assert (profile / name).is_file(), name
              finally:
                  child.terminate()
                  try:
                      child.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      child.wait(timeout=5)
          assert inventory() == before, "Helper wrote into the installed app"
          assert "dashboard: http://127.0.0.1:18191/dashboard" in (root / "helper.log").read_text()

          # Exercise status through the installed CLI with no media executables.
          code = ("import shutil, sys; sys.path.insert(0, sys.argv[1]); "
                  "shutil.which = lambda *a, **k: None; "
                  "from uoink_cli import main; sys.exit(main(['status']))")
          result = subprocess.run([str(app / "python/bin/python3"), "-c", code, str(app)],
                                  check=True, capture_output=True, text=True, timeout=30)
          status = json.loads(result.stdout)
          assert status["ok"] is True
          assert status["capabilities"]["media"]["available"] is False
          assert status["capabilities"]["media"]["code"] == "media_requires_ffmpeg"
          PY

  linux-capture-image:
    name: offline Linux podcast capture image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Generate speech fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          mkdir fixture
          espeak-ng -s 140 -w fixture/episode.wav "Sourdough bread needs a hungry starter, patience, and a long cold rise in the fridge overnight."
          ffmpeg -i fixture/episode.wav -ac 1 -ar 22050 -b:a 64k fixture/episode.mp3
          printf 'sourdough\nbread\n' > fixture/expected.txt
      - name: Build capture image
        run: |
          docker build -f docker/capture.Dockerfile -t uoink-capture:ci .
          docker image ls uoink-capture:ci --format '{{.Size}}'
          docker run --rm --entrypoint du uoink-capture:ci -sh /opt/uoink /opt/uoink/python /opt/uoink/models
      - name: Check media and bundled model status
        run: |
          docker run --rm --network none uoink-capture:ci status > capture-status.json
          cat capture-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("capture-status.json").read_text())
          assert status["ok"] is True, status
          assert status["capabilities"]["media"]["available"] is True, status
          model = status["reliability_model"]
          assert model["cached"] is True and model["source"] == "bundled", model
          assert model["bundled_model"] == "base", model
          assert model["bundled_path"] == "/opt/uoink/models/whisper-bundled/base", model
          PY
      - name: Capture, transcribe, publish and search offline
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp --tmpfs /home/uoink:uid=10001,gid=10001 -e HF_HUB_OFFLINE=1
          -v "$PWD/fixture:/fixture:ro" -v "$PWD/scripts/linux:/smoke:ro"
          --entrypoint /opt/uoink/python/bin/python3
          uoink-capture:ci /smoke/smoke_capture.py --fixture /fixture

  mcp-linux-container:
    name: offline Linux MCP introspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build stdio image
        run: docker build --tag uoink-mcp:ci .
      - name: Initialize and list the complete default registry offline
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          --entrypoint python uoink-mcp:ci
          -B /app/scripts/smoke_mcp_container.py

  extension-static:
    name: extension static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Parse extension JavaScript
        run: |
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint extension JavaScript for undefined globals
        run: |
          # v2.1 rename: the extension UI global is renamed YoinkUI -> UoinkUI
          # by the extension agent's PR. Declare BOTH so this guard stays green
          # whether or not that rename has merged yet (a not-yet-defined global
          # is harmless to eslint; an undefined-USE is what no-undef catches).
          npx --yes eslint@8 --no-eslintrc \
            --env browser,worker,webextensions,es2022 \
            --rule 'no-undef: error' \
            --rule 'no-unused-vars: off' \
            --global STC --global YoinkUI --global UoinkUI --global XArticle --global PopupCaptures \
            $(find extension -name '*.js' -print)

      - name: Validate JSON files
        run: |
          python -m json.tool extension/manifest.json >/dev/null
          python -m json.tool extension/prompts.json >/dev/null
          python -m json.tool topics.json >/dev/null

      - name: Check manifest version against VERSION
        run: |
          count="$(grep -c '"version"' extension/manifest.json)"
          if [ "$count" -ne 1 ]; then
            echo "extension/manifest.json must contain exactly one version field; found $count"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit(f"manifest version {manifest.get('version')!r} != VERSION {version!r}")
          PY

      - name: Guard against noisy extension logs
        run: |
          # Catches the legacy [Yoink] prefix and the renamed [Uoink] one so
          # the no-noisy-logs guard stays meaningful across the rename.
          if grep -nE 'console\.log\([[:space:]]*"\[(Yoink|Uoink)\]' extension/lib/extract.js; then
            echo 'Unexpected console.log("[Yoink|Uoink]"...) in extension/lib/extract.js'
            exit 1
          fi

      - name: Build allowlisted Chrome Web Store package
        run: python scripts/build_cws.py

  backend-static:
    name: backend Python static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile backend Python files
        run: |
          # v2.1 rename: canonical MCP modules are uoink_mcp*.py; yoink_mcp.py
          # is a back-compat shim that re-exports from uoink_mcp.
          files=(server.py uoink_store.py uoink_usage.py uoink_mcp.py uoink_mcp_tools.py uoink_agent_runtime.py uoink_cli.py uoink_connect.py yoink_mcp.py)
          if [ -f index.py ]; then files+=(index.py); fi
          python -m py_compile "${files[@]}"

      - name: Check complete MCP inventory
        run: python scripts/check_mcp_inventory.py

      - name: Check generated agent kit skills
        run: python scripts/build_agent_kit.py --check

  doc-accuracy:
    name: doc accuracy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Removed in v2.1: the "guard security doc version drift" step (which
      # failed the build if "v2.1" appeared in docs/security.md) is dropped
      # per the approved decision -- security.md is now the v2.1 launch-facing
      # security model and legitimately references v2.1. See the §9 commit.

      - name: Compare VERSION and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit(f"manifest version {manifest.get('version')!r} != VERSION {version!r}")
          PY

      - name: Compare MCP inventory across registry, docs, bundle and receipt
        run: python scripts/check_mcp_inventory.py

      - name: Check store install copy against shared config
        run: python scripts/sync_store_links.py --check

  bash-lint:
    name: bash script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Linux installer
        run: |
          shellcheck scripts/linux/install.sh
          sh -n scripts/linux/install.sh

      - name: Lint launch readiness script
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/verify-launch-readiness.sh
          else
            bash -n scripts/verify-launch-readiness.sh
          fi

  stdlib-tests:
    name: stdlib tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ffmpeg (Linux)
        # Linux reports media_requires_ffmpeg without ffmpeg/ffprobe on PATH;
        # Windows assumes the installer-bundled copy. Capture tests need media.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        # Match the dual-era stdio runtime and its reviewed transport dependencies,
        # plus PyYAML (the installer lock's pin) so the Continue detection tests run.
        run: pip install pytest Pillow "mcp==2.3.0" "mcp-types==2.3.0" "httpx2==2.16.0" "httpcore2==2.16.0" "truststore==0.10.5" "PyYAML==6.0.3"
      - name: Run tests
        # The Living Library tests import top-level modules (index, server,
        # library_*) directly, so the checkout root must be on PYTHONPATH.
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest tests/
